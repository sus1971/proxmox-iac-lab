---
# roles/dummy_webapp/tasks/main.yml
# Minimale nginx-installatie met een unieke hostnaam in de default-pagina,
# puur om HAProxy (fase 8) iets te geven om tegen te load-balancen.
# Geen echte applicatie — bewust een dummy, zoals afgesproken in fase 6.

- name: Ensure nginx is installed
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Deploy minimal index page with unique hostname
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: "0644"

- name: Ensure nginx service is enabled and running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
